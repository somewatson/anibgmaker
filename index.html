<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Background Generator</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Animated Background Generator">
    <meta name="description" content="A customizable, high-performance animated background generator with diverse themes and procedural audio.">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://anibgmaker.somewatson.com/">
    <meta property="og:title" content="Animated Background Generator">
    <meta property="og:description" content="A customizable, high-performance animated background generator with diverse themes and procedural audio.">
    <meta property="og:image" content="https://somewatson.com/images/watson_pfp.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://anibgmaker.somewatson.com/">
    <meta property="twitter:title" content="Animated Background Generator">
    <meta property="twitter:description" content="A customizable, high-performance animated background generator with diverse themes and procedural audio.">
    <meta property="twitter:image" content="https://somewatson.com/images/watson_pfp.png">

    <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body>
    <div id="app">
        <div id="controls">
            <h1>BG Generator</h1>
            <div id="fpsCounter">FPS: 60</div>
            
            <div class="control-group">
                <label>Theme</label>
                <select id="themeSelect">
                    <option value="particles">Particles</option>
                    <option  value="shapes">Geometric Shapes</option>
                    <option value="stars">Starry Night</option>
                    <option value="fireworks">Fireworks</option>
                    <option value="birds">Flying Birds</option>
                    <option value="matrix">Digital Rain</option>
                    <option value="bubbles">Floating Bubbles</option>
                    <option value="nebula">Nebula Clouds</option>
                    <option value="confetti">Confetti</option>
                    <option value="snow">Digital Snow</option>
                    <option value="warp">Warp Speed</option>
                    <option value="tunnel">Tunnel Vision</option>
                    <option value="tronCity">Tron City</option>
                    <option value="tronCircuit">Tron Circuit</option>
                    <option value="tronArena">Disc Arena</option>
                    <option value="triangles">Triangle Storm</option>
                    <option value="tempest">Tempest 2000</option>
                    <option value="beach">Tropical Beach</option>
                    <option value="lightsaber">Light Saber</option>
                </select>
                <div style="display: flex; gap: 5px; margin-top: 5px;">
                    <button id="prevThemeBtn" style="flex: 1;">⬅ Prev Theme</button>
                    <button id="nextThemeBtn" style="flex: 1;">Next Theme ➔</button>
                </div>
            </div>

            <div class="control-group">
                <label>Count</label>
                <input type="range" id="countSlider" min="10" max="200" value="50">
                <span id="countValue">50</span>
            </div>
            
            <div class="control-group">
                <label>Speed</label>
                <input type="range" id="speedSlider" min="1" max="10" value="2">
                <span id="speedValue">2</span>
            </div>

            <div class="control-group">
                <label>Color</label>
                <input type="color" id="colorPicker" value="#00ffcc">
            </div>
            <div class="control-group">
                <label>Accent Color</label>
                <input type="color" id="accentColorPicker" value="#ff00ff">
            </div>

            <div class="control-group">
                <label>BG Color</label>
                <input type="color" id="bgColorPicker" value="#0a0a0a">
            </div>

            <button id="randomizeBtn">Randomize Style</button>
            <button id="randomizeColorsBtn">Randomize Colors</button>
                <button id="randomizeAllBtn">Randomize All</button>
                <button id="micBtn">Enable Microphone</button>
                <button id="hideMenuBtn">Hide Menu</button>
                <div class="footer-links">
                    <a href="https://github.com/somewatson/anibgmaker" target="_blank" class="footer-link">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                        GitHub Repository
                    </a>
                    <a href="https://somewatson.com" target="_blank" class="footer-link">Some Watson's Homepage</a>
                </div>
            </div>

        <div id="audioControls">
                <div style="display: flex; gap: 5px; align-items: center; width: 100%;">
                    <select id="musicTheme" style="flex: 1;">
                        <option value="ambient">Ambient (Stars)</option>
                        <option value="techno">Techno (Shapes)</option>
                        <option value="calm">Calm (Particles)</option>
                        <option value="energetic">Energetic (Fireworks)</option>
                        <option value="synthwave">Synthwave (Grid)</option>
                        <option value="lofi">Lo-Fi (Rain/Clouds)</option>
                        <option value="euphoric">Euphoric (Bubbles)</option>
                        <option value="glitch">Glitch (Matrix)</option>
                        <option value="rain">Rain Noise</option>
                        <option value="waves">Ocean Waves</option>
                        <option value="tron">Tron (Tron Themes)</option>
                    </select>
                    <button id="prevMusicBtn" style="width: 40px; flex-shrink: 0;">⬅</button>
                    <button id="nextMusicBtn" style="width: 40px; flex-shrink: 0;">➔</button>
                </div>

            <button id="toggleMusic">Play Music</button>
        </div>

        <div id="showMenuBtn">Show Menu</div>
        <canvas id="bgCanvas"></canvas>
    </div>
    <script src="js/audio.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main_2d.js?v=1.2Someth"></script>

</body>
</html>
